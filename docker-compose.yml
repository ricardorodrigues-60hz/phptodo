services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phptodo_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=phptodo_db
      - DB_USER=phptodo_user
      - DB_PASS=phptodo_password
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: phptodo_db
    restart: always
    environment:
      MYSQL_DATABASE: phptodo_db
      MYSQL_USER: phptodo_user
      MYSQL_PASSWORD: phptodo_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

volumes:
  db_data:
